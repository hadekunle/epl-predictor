name: Semver Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Guard: skip if the push came from the bot itself (prevents infinite loop)
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so github-tag-action can find the previous tag
          fetch-depth: 0

      - name: Bump version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # false = no bump when commit message has no keyword
          default_bump: false
          initial_version: 0.1.0
          major_string_token: "[major]"
          minor_string_token: "[minor]"
          patch_string_token: "[patch]"
          tag_prefix: v
          release_branches: main
          create_annotated_tag: true

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          draft: false
          prerelease: false

      - name: Update CHANGELOG.md
        if: steps.tag.outputs.new_tag != ''
        run: |
          NEW_ENTRY="## ${{ steps.tag.outputs.new_tag }} ($(date +%Y-%m-%d))\n\n${{ steps.tag.outputs.changelog }}\n\n"
          if [ -f CHANGELOG.md ]; then
            echo -e "${NEW_ENTRY}$(cat CHANGELOG.md)" > CHANGELOG.md
          else
            echo -e "# Changelog\n\n${NEW_ENTRY}" > CHANGELOG.md
          fi

      - name: Commit and push CHANGELOG.md
        if: steps.tag.outputs.new_tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for ${{ steps.tag.outputs.new_tag }} [skip ci]"
          git push
