name: Semver Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Guard: skip if the push came from the bot itself (prevents infinite loop)
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required to find the previous tag
          fetch-depth: 0

      - name: Compute next version
        id: tag
        run: |
          # Collect all commit messages since the last tag (or all commits if no tag exists)
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            MESSAGES=$(git log --pretty=format:"%s %b" HEAD)
            CURRENT="v0.0.0"
          else
            MESSAGES=$(git log --pretty=format:"%s %b" "${LATEST_TAG}..HEAD")
            CURRENT="$LATEST_TAG"
          fi

          # Determine highest-precedence keyword across all commits
          if echo "$MESSAGES" | grep -qF '[major]'; then
            BUMP=major
          elif echo "$MESSAGES" | grep -qF '[minor]'; then
            BUMP=minor
          elif echo "$MESSAGES" | grep -qF '[patch]'; then
            BUMP=patch
          else
            echo "No [major]/[minor]/[patch] keyword found — skipping release."
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Parse current version numbers (strip leading 'v')
          VERSION="${CURRENT#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Apply bump
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}"       >> "$GITHUB_OUTPUT"
          echo "previous_tag=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${BUMP}: ${CURRENT} → ${NEW_TAG}"

      - name: Build changelog
        id: changelog
        if: steps.tag.outputs.new_tag != ''
        run: |
          PREVIOUS="${{ steps.tag.outputs.previous_tag }}"
          NEW_TAG="${{ steps.tag.outputs.new_tag }}"

          if [ "$PREVIOUS" = "v0.0.0" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "${PREVIOUS}..HEAD")
          fi

          # Write to a file to safely pass multiline content between steps
          {
            echo "## ${NEW_TAG} ($(date +%Y-%m-%d))"
            echo ""
            echo "$LOG"
            echo ""
          } > /tmp/entry.md

          # Store for the release body (escaped for GITHUB_OUTPUT)
          {
            echo "body<<EOF"
            cat /tmp/entry.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create git tag
        if: steps.tag.outputs.new_tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tag.outputs.new_tag }}" -m "Release ${{ steps.tag.outputs.new_tag }}"
          git push origin "${{ steps.tag.outputs.new_tag }}"

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false

      - name: Update CHANGELOG.md
        if: steps.tag.outputs.new_tag != ''
        run: |
          if [ -f CHANGELOG.md ]; then
            echo -e "$(cat /tmp/entry.md)\n$(cat CHANGELOG.md)" > CHANGELOG.md
          else
            echo -e "# Changelog\n\n$(cat /tmp/entry.md)" > CHANGELOG.md
          fi

      - name: Commit and push CHANGELOG.md
        if: steps.tag.outputs.new_tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for ${{ steps.tag.outputs.new_tag }} [skip ci]"
          git push
